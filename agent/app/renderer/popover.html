<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #111827;
      user-select: none;
    }

    @font-face {
      font-family: 'Inter';
      src: url('../assets/inter-latin-var.woff2') format('woff2-variations');
      font-weight: 100 900;
    }

    .popover {
      position: absolute;
      inset: 0;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(17, 24, 39, 0.16);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .pop-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pop-head img {
      width: 26px;
      height: 26px;
    }

    .pop-head .name {
      font-size: 14.5px;
      font-weight: 700;
    }

    .pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 10px;
      font-size: 11.5px;
      font-weight: 600;
      background: #EAEF55;
      border: 1px solid #D9DE45;
      border-radius: 999px;
    }

    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22C55E;
    }

    .pill.paused {
      background: #F7F7F2;
      border-color: #E5E7EB;
      color: #667085;
    }

    .pill.paused .dot {
      background: #98A2B3;
    }

    .pill.offline {
      background: #FEF3F1;
      border-color: #FECDCA;
      color: #B42318;
    }

    .pill.offline .dot {
      background: #EF4444;
    }

    .pop-status {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-row .pend {
      color: #667085;
    }

    .status-row svg {
      flex: none;
    }

    .pop-divider {
      height: 1px;
      background: #E5E7EB;
      margin: 12px -6px 8px -6px;
    }

    .pop-menu {
      display: flex;
      flex-direction: column;
    }

    .pop-menu .item {
      display: flex;
      align-items: center;
      gap: 11px;
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .pop-menu .item:hover {
      background: #F7F7F2;
    }

    .pop-menu .item.danger {
      color: #B42318;
    }

    .pop-menu .item.danger:hover {
      background: #FEF3F1;
    }
  </style>
</head>

<body>
  <div class="popover">
    <div class="pop-head">
      <img src="../assets/logo-icon.png" alt="LabelGo">
      <span class="name">LabelGo Agent</span>
      <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">Online</span></span>
    </div>

    <div class="pop-status">
      <div class="status-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9" />
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
          <rect x="6" y="14" width="12" height="8" />
        </svg>
        <span id="printer-name">—</span>
      </div>
      <div class="status-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
          <path d="M8 8h8" />
          <path d="M8 12h8" />
          <path d="M8 16h5" />
        </svg>
        <span class="pend" id="pending">0 confirmações pendentes</span>
      </div>
    </div>

    <div class="pop-divider"></div>

    <div class="pop-menu">
      <div class="item" id="mi-open">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        Abrir painel
      </div>
      <div class="item" id="mi-test">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9" />
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
          <rect x="6" y="14" width="12" height="8" />
        </svg>
        Imprimir teste
      </div>
      <div class="item" id="mi-pause">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16" rx="1.5" />
          <rect x="14" y="4" width="4" height="16" rx="1.5" />
        </svg>
        <span id="pause-text">Pausar agente</span>
      </div>
      <div class="item danger" id="mi-quit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.72 0" />
          <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
        Sair
      </div>
    </div>
  </div>

  <script src="popover.js"></script>
</body>

</html>
