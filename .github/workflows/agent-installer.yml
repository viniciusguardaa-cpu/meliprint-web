name: Agent Installer

# Builds the Windows installer (LabelGoAgent-Setup.exe via electron-builder
# NSIS, per-user install, no admin) and publishes it to the `agent-latest`
# GitHub release. The site serves it at /downloads/LabelGoAgent-Setup.exe
# via a Netlify redirect.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-installer.yml'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies (agent)
        working-directory: agent
        run: npm ci

      - name: Build LabelGoAgent-Setup.exe
        working-directory: agent
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelGoAgent-Setup
          path: agent/dist/LabelGoAgent-Setup.exe
          retention-days: 30

      - name: Publish agent-latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = 'agent/dist/LabelGoAgent-Setup.exe'
          gh release view agent-latest --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload agent-latest $asset --clobber --repo ${{ github.repository }}
          } else {
            gh release create agent-latest $asset `
              --title 'LabelGo Agent' `
              --latest `
              --notes 'Instalador Windows do LabelGo Agent (build automatico via CI).' `
              --repo ${{ github.repository }}
          }
