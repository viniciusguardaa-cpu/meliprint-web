name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Disposable Postgres for the DB-gated migration/regression tests.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labelgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Audit web dependencies
        run: npm audit

      - name: Install agent dependencies
        run: npm ci
        working-directory: agent
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Audit agent dependencies
        run: npm audit
        working-directory: agent

      - name: Typecheck (server)
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Typecheck (client)
        run: npx tsc --noEmit --project client/tsconfig.json

      - name: Agent smoke check
        run: node agent.js --check
        working-directory: agent

      - name: Agent tests
        run: npm test
        working-directory: agent

      - name: Migration validation (disposable Postgres)
        run: bash server/scripts/test-migrations.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/labelgo_test

      - name: Tests
        run: npm test
        env:
          NODE_ENV: development
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/labelgo_test

      - name: Build
        run: npm run build
