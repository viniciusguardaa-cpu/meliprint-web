[build]
  command = "npm run build --workspace=client"
  publish = "client/dist"

# Windows agent installer — built by .github/workflows/agent-installer.yml and
# published on the `agent-latest` GitHub release. Redirect instead of committing
# the binary to the repo.
[[redirects]]
  from = "/downloads/LabelGoAgent-Setup.exe"
  to = "https://github.com/viniciusguardaa-cpu/meliprint-web/releases/download/agent-latest/LabelGoAgent-Setup.exe"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://web-production-c2ba5.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback — apenas para rotas do app que dependem de sessão/cliente.
# As páginas públicas são arquivos reais pré-renderizados (dist/<rota>/index.html)
# e qualquer outro caminho recebe o 404.html da Netlify com status 404 de verdade.
[[redirects]]
  from = "/dashboard"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/print/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/auto-print"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/subscription"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/subscription/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/configuracoes"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/spa.html"
  status = 200

# Reforço de noindex fora do robots.txt: o shell SPA e as rotas privadas
# carregam meta noindex; estes headers cobrem crawlers que não executam JS.
[[headers]]
  for = "/spa.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/print/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auto-print"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/subscription"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/subscription/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/configuracoes"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
