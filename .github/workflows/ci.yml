name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck (server)
        run: npm run build --workspace=server -- --noEmit || npx tsc --noEmit --project server/tsconfig.json

      - name: Typecheck (client)
        run: npm run build --workspace=client -- --noEmit || npx tsc --noEmit --project client/tsconfig.json

      - name: Tests
        run: npm test --workspace=server
        env:
          NODE_ENV: development

      - name: Build
        run: npm run build
